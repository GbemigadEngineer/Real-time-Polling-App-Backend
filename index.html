<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting App</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="http://localhost:8000/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Your Favourite</h2>
      <div class="progress-box" id=" html">
        <p>HTML</p>
        <div class="progress-bar">
          <span data="30%" class="percent-tag"></span>
        </div>
      </div>
      <div class="progress-box" id="css">
        <p>CSS</p>
        <div class="progress-bar">
          <span data="30%" class="percent-tag"></span>
        </div>
      </div>
      <div class="progress-box" id="python">
        <p>PYTHON</p>
        <div class="progress-bar">
          <span data="30%" class="percent-tag"></span>
        </div>
      </div>
      <div class="progress-box" id="javascript">
        <p>JAVASCRIPT</p>
        <div class="progress-bar">
          <span data="30%" class="percent-tag"></span>
        </div>
      </div>
    </div>
    <script defer src="script.js"></script>
  </body>
</html>
